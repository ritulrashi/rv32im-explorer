# Phase 2 baseline: static not-taken, no BTB, ideal (uncached) memory.
# Must reproduce Phase 2 cycle counts exactly (docs/phase3-design.md §0.1).
# This is also the only configuration the Phase 5 RTL implements.
core.mul_latency = 3
core.div_latency = 33
bpred.type = static_nt
bpred.entries = 512
bpred.history_bits = 8
btb.entries = 0
icache.enabled = false
dcache.enabled = false
