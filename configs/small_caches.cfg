# A small embedded-class core: bimodal + BTB, 1 KiB 2-way L1 I/D, 16 B lines.
bpred.type = bimodal
bpred.entries = 512
btb.entries = 64
icache.enabled = true
icache.size_bytes = 1024
icache.assoc = 2
icache.line_bytes = 16
dcache.enabled = true
dcache.size_bytes = 1024
dcache.assoc = 2
dcache.line_bytes = 16
